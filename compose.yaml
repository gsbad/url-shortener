# Compose para desenvolvimento local.
#
#   docker compose up -d db        só o banco — é o que os testes precisam
#   docker compose up --build      banco + aplicação
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      # Credencial de desenvolvimento local, igual ao default do
      # application.yml. Não é secret: o banco só escuta em localhost.
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # A aplicação só sobe depois que o banco aceita conexão. Sem isso, o
      # Flyway falha na primeira tentativa e o container reinicia.
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: urlshortener
      DB_USER: urlshortener
      DB_PASSWORD: urlshortener
      APP_BASE_URL: http://localhost:8080

volumes:
  pgdata:
