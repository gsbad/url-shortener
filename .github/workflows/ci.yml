# Pipeline padrão Java da plataforma:
#   checkout → compile → test → package → build da imagem → smoke test →
#   publish (GHCR) → deploy (OCI Compute, Postgres dedicado)
#
# Jobs publish/deploy gerados pelo Template "Publicar lab na OCI" do
# Backstage (_labs/backstage-lab/templates/publish-lab-to-oci) — build/test
# preservados do CI original do projeto. Arquivo estático (fetch:plain, sem
# Nunjucks) — primeiro caso real é o url-shortener; generalizar com
# parâmetros de verdade fica para quando houver um segundo caso.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", "catalog-info.yaml", "mkdocs.yml"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urlshortener
          # Credencial efêmera de um serviço que só existe durante este job e
          # só escuta em localhost do runner. Não é secret.
          POSTGRES_PASSWORD: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compilar
        run: mvn -B compile

      - name: Testes
        run: mvn -B test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: urlshortener
          DB_USER: urlshortener
          DB_PASSWORD: urlshortener

      - name: Empacotar
        run: mvn -B package -DskipTests

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ${{ github.event.repository.name }}:${{ github.sha }} .

      - name: Smoke test da imagem
        run: |
          docker network create smoke-net
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_DB=urlshortener \
            -e POSTGRES_USER=urlshortener \
            -e POSTGRES_PASSWORD=urlshortener \
            --health-cmd "pg_isready -U urlshortener -d urlshortener" \
            --health-interval 5s --health-retries 10 \
            postgres:16-alpine

          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" = healthy ] && break
            sleep 2
          done

          docker run -d --name smoke-api --network smoke-net -p 8080:8080 \
            -e DB_HOST=smoke-db \
            -e DB_USER=urlshortener \
            -e DB_PASSWORD=urlshortener \
            -e DB_NAME=urlshortener \
            ${{ github.event.repository.name }}:${{ github.sha }}

          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/health; then
              echo
              echo "health OK — exercitando a API"
              code=$(curl -fs -X POST http://localhost:8080/api/urls \
                       -H 'Content-Type: application/json' \
                       -d '{"url":"https://example.com"}' \
                     | grep -oE '"code":"[^"]+"' | cut -d'"' -f4)
              echo "código gerado: $code"
              curl -fs "http://localhost:8080/api/urls/$code"
              echo
              exit 0
            fi
            sleep 3
          done

          echo "a aplicação não respondeu"
          docker logs smoke-api
          exit 1

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      # Sem passo de "tornar público" aqui — não existe API do GitHub pra
      # isso, testado ao vivo (2026-08-30). Se o deploy falhar com
      # "unauthorized" no pull, é isso: torne o pacote público manualmente
      # em Package settings → Danger Zone → Change visibility. Ver
      # development-workflow.md §Gap de autenticação GHCR.


  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH na OCI Compute
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          HOST: ${{ secrets.OCI_HOST }}
          USER: ${{ secrets.OCI_USER }}
          # Postgres dedicado ao url-shortener, não compartilhado — secret
          # próprio, precisa existir antes do primeiro deploy real.
          DB_PASSWORD: ${{ secrets.URLSHORTENER_DB_PASSWORD }}
          TAG: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$USER@$HOST" bash -s -- \
            "$IMAGE:$TAG" "$DB_PASSWORD" <<'REMOTE'
          set -e
          IMG="$1"
          DB_PASSWORD="$2"
          NET="url-shortener-net"
          DB_VOLUME="url-shortener-db-data"
          DB_NAME="urlshortener"

          docker network create "$NET" 2>/dev/null || true
          docker volume create "$DB_VOLUME" 2>/dev/null || true

          # Postgres dedicado — não compartilhado com nenhum outro serviço
          # da VM. Sobe só se ainda não existir; não recria a cada deploy
          # (perderia os dados).
          if ! docker inspect url-shortener-db >/dev/null 2>&1; then
            docker run -d --name url-shortener-db --network "$NET" \
              --restart unless-stopped \
              -v "$DB_VOLUME:/var/lib/postgresql/data" \
              -e POSTGRES_DB="$DB_NAME" -e POSTGRES_USER="$DB_NAME" \
              -e POSTGRES_PASSWORD="$DB_PASSWORD" \
              postgres:16-alpine
          fi

          for i in $(seq 1 15); do
            docker exec url-shortener-db pg_isready -U "$DB_NAME" && break
            sleep 2
          done

          docker pull "$IMG"
          docker stop url-shortener 2>/dev/null || true
          docker rm url-shortener 2>/dev/null || true
          docker run -d --name url-shortener --network "$NET" \
            --restart unless-stopped -p 8002:8080 \
            -e DB_HOST=url-shortener-db -e DB_USER="$DB_NAME" \
            -e DB_PASSWORD="$DB_PASSWORD" -e DB_NAME="$DB_NAME" \
            "$IMG"

          # Spring Boot + JPA leva mais de 30s pra subir (testado ao vivo:
          # ainda em "Bootstrapping JPA repositories" aos 15s) — diferente
          # do FastAPI dos outros projetos da fábrica. 40x3s = 120s.
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8002/health; then echo "OK"; exit 0; fi
            sleep 3
          done
          echo "health check nao respondeu apos deploy"; docker logs url-shortener; exit 1
          REMOTE
