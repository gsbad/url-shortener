# Pipeline padrão Java da plataforma:
#   checkout → compile → test → package → build da imagem → validação
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compilar
        run: mvn -B compile

      - name: Testes
        run: mvn -B test

      - name: Empacotar
        run: mvn -B package -DskipTests

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ${{ github.event.repository.name }}:${{ github.sha }} .

      - name: Smoke test da imagem
        run: |
          docker run -d --name smoke -p 8080:8080 \
            ${{ github.event.repository.name }}:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health; then echo "OK"; exit 0; fi
            sleep 2
          done
          echo "health check nao respondeu"; docker logs smoke; exit 1
