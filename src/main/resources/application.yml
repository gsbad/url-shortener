spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}
    username: ${DB_USER:urlshortener}
    password: ${DB_PASSWORD:urlshortener}

  jpa:
    # Quem cria e altera schema é o Flyway. O Hibernate apenas confere que o
    # mapeamento bate com o que existe — se divergir, a aplicação não sobe.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  environment: ${ENVIRONMENT:development}
  # Base usada para montar shortUrl. Fixar o host no código impediria o mesmo
  # binário de rodar em ambientes diferentes.
  base-url: ${APP_BASE_URL:http://localhost:8080}

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
